<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — EduBright SMS</title>
  {% load static %}
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Sans',sans-serif;background:linear-gradient(135deg,#2ecc71 0%,#27ae60 55%,#1e8449 100%);position:relative;padding:40px 16px}
    body::before{content:'';position:fixed;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,0.07) 1px,transparent 1px);background-size:26px 26px;pointer-events:none}
    .brand{display:flex;align-items:center;gap:10px;margin-bottom:22px}
    .brand img{width:52px;height:52px;object-fit:contain}
    .brand-name{font-size:1.2rem;font-weight:700;color:#fff;letter-spacing:0.3px}
    h1{color:#fff;font-size:1.85rem;font-weight:700;margin-bottom:24px;text-align:center}
    .card{background:#fff;border-radius:14px;padding:34px 36px 28px;width:100%;max-width:450px;box-shadow:0 12px 44px rgba(0,0,0,0.14)}
    .alert{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb;border-radius:7px;padding:10px 14px;margin-bottom:16px;font-size:0.9rem}
    .alert.success{background:#d4edda;color:#155724;border-color:#c3e6cb}
    .field{margin-bottom:18px}
    label{display:block;font-weight:600;color:#2b2b2b;margin-bottom:6px;font-size:0.94rem}
    input{width:100%;padding:12px 14px;border:1.5px solid #ccc;border-radius:7px;font-size:0.95rem;font-family:inherit;outline:none;transition:border-color 0.2s,box-shadow 0.2s}
    input:focus{border-color:#27ae60;box-shadow:0 0 0 3px rgba(39,174,96,0.12)}
    .btn{display:block;width:fit-content;margin:24px auto 0;padding:12px 54px;background:#1a8a1a;color:#fff;border:none;border-radius:7px;font-size:1rem;font-weight:600;font-family:inherit;cursor:pointer;transition:background 0.2s,transform 0.15s}
    .btn:hover{background:#157015;transform:translateY(-1px)}
    .back-login{text-align:center;margin-top:18px;font-size:0.88rem;color:#555}
    .back-login a{color:#27ae60;font-weight:600;text-decoration:none}
    .back-login a:hover{text-decoration:underline}
    .back{margin-top:20px;text-align:center}
    .back a{color:rgba(255,255,255,0.85);font-size:0.88rem;text-decoration:none}
    .back a:hover{color:#fff}
  </style>
</head>
<body>
  <div class="brand">
    <img src="{% static 'images/logo.png' %}" alt="Logo" onerror="this.style.display='none'">
    <span class="brand-name">EduBright Academy</span>
  </div>
  <h1>User Registration</h1>
  <div class="card">
    {% if messages %}
      {% for msg in messages %}
        <div class="alert {% if 'success' in msg.tags %}success{% endif %}">{{ msg }}</div>
      {% endfor %}
    {% endif %}
    <form method="POST" action="{% url 'register' %}">
      {% csrf_token %}
      <div class="field">
        <label for="user_name">Full Name:</label>
        <input type="text" id="user_name" name="user_name" required placeholder="Enter your full name">
      </div>
      <div class="field">
        <label for="user_mobile">User Mobile:</label>
        <input type="tel" id="user_mobile" name="user_mobile" placeholder="e.g. 01700000000">
      </div>
      <div class="field">
        <label for="user_email">User Email:</label>
        <input type="email" id="user_email" name="user_email" required placeholder="you@email.com">
      </div>
      <div class="field">
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required placeholder="Min 8 characters">
      </div>
      <button type="submit" class="btn">Submit</button>
    </form>
    <p class="back-login">Already have an account? <a href="{% url 'login' %}">← Back to Login</a></p>
  </div>
  <div class="back"><a href="{% url 'home' %}">← Back to Home</a></div>
</body>
</html>
