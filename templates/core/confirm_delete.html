{% extends "sms_base.html" %}
{% block title %}Delete{% endblock %}
{% block content %}

<div class="panel" style="max-width:500px; text-align:center;">
  <h2 style="color:#dc3545;">⚠ Confirm Delete</h2>
  <p style="margin: 18px 0; color:#555; font-size:1rem;">
    Are you sure you want to delete <strong>{{ obj }}</strong>?<br>
    This action cannot be undone.
  </p>
  <form method="POST">
    {% csrf_token %}
    <button type="submit" class="btn-green" style="background:#dc3545;">Yes, Delete</button>
    &nbsp;&nbsp;
    <a href="{% url back_url %}" class="btn-green" style="background:#555;">Cancel</a>
  </form>
</div>

{% endblock %}
